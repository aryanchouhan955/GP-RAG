services:
  # ── Combined Web Server & Worker ─────────────────────────────────────────────
  - type: web
    name: gp-rag-api
    env: python
    plan: free
    rootDir: server_python
    buildCommand: pip install -r requirements.txt
    # This command starts the worker in the background (&) and the API in the foreground
    startCommand: python worker.py & uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: gp-rag-docs
      - key: REDIS_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
