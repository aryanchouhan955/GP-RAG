services:
  # ── FastAPI Web Server ────────────────────────────────────────────────────────
  - type: web
    name: gp-rag-api
    env: python
    rootDir: server_python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: gp-rag-docs
      - key: REDIS_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # ── Background Worker (RQ) ────────────────────────────────────────────────────
  - type: worker
    name: gp-rag-worker
    env: python
    rootDir: server_python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: gp-rag-docs
      - key: REDIS_URL
        sync: false
      - key: MONGO_URI
        sync: false
